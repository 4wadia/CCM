name: credit_card_manager
description: "Local-first credit card management for Android and iOS."
publish_to: 'none'

version: 0.3.0+4

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  drift: ^2.35.3
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_appauth: ^13.0.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  material_ui: any
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  syncfusion_flutter_pdf: ^35.1.43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/logos/banks/
    - assets/logos/providers/
    - assets/logo/
