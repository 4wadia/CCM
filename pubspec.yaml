name: credit_card_manager
description: "Local-first credit card management for Android and iOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
